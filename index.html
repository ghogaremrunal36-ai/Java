
<html>
<head>
    <title>JSP Cookie and Session</title>
</head>
<body>

<h2>A. Store User Name in Cookie</h2>

<form action="cookieStore.jsp" method="post">
    Enter User Name:
    <input type="text" name="username" required>
    <input type="submit" value="Store Cookie">
</form>

<br>

<a href="cookieDisplay.jsp">Display Cookie</a>

<hr>

<h2>B. Display All Cookies</h2>

<a href="allCookies.jsp">Display All Cookies</a>

<hr>

<h2>C. Store User Name in Session</h2>

<form action="sessionStore.jsp" method="post">
    Enter User Name:
    <input type="text" name="username" required>
    <input type="submit" value="Store Session">
</form>

<br>

<a href="sessionDisplay.jsp">Display Session</a>

</body>
</html>
