<body>

<h2>Cookie Example</h2>

<form action="CookieStoreServlet" method="post">

    Enter User Name:
    <input type="text" name="username" required>

    <input type="submit" value="Store Cookie">

</form>

<br>

<a href="CookieReadServlet">Read Cookie</a>

<br><br>

<a href="DisplayCookiesServlet">Display All Cookies</a>

<hr>

<h2>Session Example</h2>

<form action="SessionStoreServlet" method="post">

    Enter User Name:
    <input type="text" name="username" required>

    <input type="submit" value="Store Session">

</form>

<br>

<a href="SessionReadServlet">Read Session</a>

</body>
</html>
